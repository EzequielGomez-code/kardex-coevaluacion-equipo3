{% load formato %}
<div class="tarjeta-fila">
  <div class="tarjeta-fila__principal">
    <a href="{% url 'movimientos:detalle' fila.pk %}">{{ fila.numero|mono }}</a>
  </div>
  <div class="tarjeta-fila__linea">
    <span class="texto-2">{{ fila.tipo.nombre }}</span>
    <span class="texto-3">{{ fila.fecha|fecha_hora }}</span>
  </div>
  <div class="tarjeta-fila__linea">
    <span class="texto-3">Solicitado por</span>
    <span class="texto-2">{{ fila.usuario.nombre_completo }}</span>
  </div>
  <div class="tarjeta-fila__acciones">
    <button class="boton boton--secundario" type="button"
            hx-get="{% url 'movimientos:rechazar' fila.pk %}" hx-target="#modal">
      {% icono "cerrar" %} Rechazar
    </button>
    <button class="boton boton--primario" type="button"
            hx-post="{% url 'movimientos:aprobar' fila.pk %}" hx-swap="none"
            hx-confirm="¿Aprobar «{{ fila.numero }}»? Se aplicará sobre el inventario de inmediato.">
      {% icono "cheque" %} Aprobar
    </button>
  </div>
</div>
