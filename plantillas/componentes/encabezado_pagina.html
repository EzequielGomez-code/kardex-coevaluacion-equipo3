{# Encabezado de pantalla: título, bajada opcional y acciones a la derecha. #}
<div class="encabezado">
  <div>
    <h1 class="encabezado__titulo">{{ titulo }}</h1>
    {% if bajada %}<p class="encabezado__bajada">{{ bajada }}</p>{% endif %}
  </div>
  {% if acciones %}<div class="encabezado__acciones">{{ acciones }}</div>{% endif %}
</div>
